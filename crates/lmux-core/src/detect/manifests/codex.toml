# codex 屏幕状态规则（兜底）
[[rules]]
status = "blocked"
region = "bottom"
contains = [
    "Allow command?",
    "approve?",
    "Action Required",
]
regex = ["^\\s*\\(y\\)es / \\(n\\)o"]

[[rules]]
status = "working"
region = "bottom"
contains = [
    "Thinking…",
    "Thinking...",
]
regex = [
    "[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏◐◑◒◓]",
]

[[rules]]
status = "working"
region = "osc_title"
contains = ["⋯", "Thinking", "thinking"]

[[rules]]
status = "idle"
region = "bottom"
regex = [
    "[>❯]\\s*$",
    "(?i)codex\\s*[>❯]\\s*$",
]
