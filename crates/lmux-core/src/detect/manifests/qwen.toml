# Qwen Code screen-state fallback rules
[[rules]]
status = "blocked"
region = "bottom"
contains = [
    "Qwen Code needs your approval",
    "Qwen Code is waiting for input",
]

[[rules]]
status = "working"
region = "osc_title"
regex = ["(?i)qwen(?: code)?.*(working|thinking|running)"]

[[rules]]
status = "idle"
region = "bottom"
regex = ["(?i)^\\s*qwen(?: code)?\\s*[>❯]\\s*$"]
