# opencode 屏幕状态规则（兜底）
[[rules]]
status = "blocked"
region = "bottom"
contains = [
    "Allow tool?",
    "permission.ask",
]

[[rules]]
status = "working"
region = "bottom"
contains = [
    "Thinking…",
    "Thinking...",
]
regex = ["[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏◐◑◒◓]"]

[[rules]]
status = "idle"
region = "bottom"
regex = [
    "[>❯]\\s*$",
    "(?i)opencode\\s*[>❯]\\s*$",
]
